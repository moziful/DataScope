version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datascope-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://datascope_user:datascope_secure_pass@postgres:5432/datascope_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: datascope-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: datascope_user
      POSTGRES_PASSWORD: datascope_secure_pass
      POSTGRES_DB: datascope_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datascope_user -d datascope_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
